<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Little Momo Evening for Hiya ♡</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-dark: #050505;
            --gold: #d4af37;
            --gold-light: #fbe699;
            --text-main: #fcfcfc;
            --text-muted: #b3b3b3;
            --accent-red: #8a1c1c;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 175, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Lato', sans-serif;
            color: var(--text-main);
            overflow: hidden; /* Prevent scrolling during animation */
        }

        /* --- BACKGROUND & CINEMATIC LIGHTING --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #15120a 0%, var(--bg-dark) 100%);
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        .bokeh {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(20px);
            animation: float-bokeh 20s infinite alternate ease-in-out;
        }
        .bokeh-1 { top: 10%; left: 20%; width: 300px; height: 300px; }
        .bokeh-2 { bottom: 10%; right: 10%; width: 400px; height: 400px; animation-delay: -5s; }

        @keyframes float-bokeh {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.1); }
        }

        /* --- INTRO ANIMATION SEQUENCE --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 2s ease-in-out;
        }

        .golden-light {
            width: 2px;
            height: 2px;
            background-color: var(--gold-light);
            border-radius: 50%;
            box-shadow: 0 0 20px 10px rgba(212, 175, 55, 0.0);
            opacity: 0;
        }

        .intro-text {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: var(--gold-light);
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            padding: 0 20px;
        }

        .intro-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- MAIN INVITATION --- */
        #main-screen {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease-in-out;
            overflow-y: auto; /* Allow scrolling on very small heights */
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            transform: translateY(30px);
            transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 1.5s ease;
        }

        #main-screen.visible .glass-card {
            transform: translateY(0);
        }

        /* --- MOMO VISUAL (SVG) --- */
        .momo-container {
            margin: 0 auto 20px auto;
            width: 120px;
            height: 100px;
            position: relative;
        }

        .steam {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            opacity: 0;
            animation: rise 3s infinite ease-in;
        }
        .steam-1 { animation-delay: 0.2s; }
        .steam-2 { animation-delay: 1.2s; }
        .steam-3 { animation-delay: 2.2s; }

        @keyframes rise {
            0% { transform: translateY(10px) translateX(0) scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-30px) translateX(10px) scale(1.2); opacity: 0; }
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 2.8rem);
            color: var(--text-main);
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .quote {
            font-style: italic;
            font-family: 'Playfair Display', serif;
            font-size: clamp(1rem, 3.5vw, 1.1rem);
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .location {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .location svg {
            fill: var(--gold);
            width: 16px;
        }

        /* --- BUTTON --- */
        .luxury-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
            border: 1px solid var(--gold);
            color: var(--gold-light);
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            outline: none;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .luxury-btn:hover, .luxury-btn:active {
            background: var(--gold);
            color: var(--bg-dark);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transform: scale(1.02);
        }

        .btn-text { position: relative; z-index: 2; }

        /* --- SUCCESS MESSAGE --- */
        #success-message {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
            margin-top: 20px;
        }
        
        #success-message.show {
            display: block;
            opacity: 1;
        }

        #success-message p {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--gold-light);
            line-height: 1.5;
        }

        /* --- MUSIC CONTROLS --- */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            opacity: 0; /* Hidden during intro */
        }

        .music-control svg {
            width: 18px;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
        }

        .music-control.playing svg {
            fill: var(--gold);
        }
        
        .music-control:hover svg {
            fill: var(--text-main);
        }

        /* --- INTERACTIVE PARTICLES --- */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: float-up 2s ease-out forwards;
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5) rotate(45deg); opacity: 0; }
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 375px) {
            .glass-card { padding: 30px 20px; }
            .momo-container { width: 100px; height: 85px; }
        }
        @media (max-height: 700px) {
            .glass-card { padding: 25px 20px; }
            .quote { margin-bottom: 20px; }
            .location { margin-bottom: 25px; }
        }
    </style>
</head>
<body>

    <!-- Background Audio -->
    <!-- REPLACE 'music.mp3' WITH YOUR OWN FILE PATH/URL -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Control Button -->
    <div class="music-control" id="music-btn" title="Toggle Music">
        <!-- Play Icon -->
        <svg id="icon-play" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
        <!-- Pause Icon (hidden initially) -->
        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </div>

    <!-- Cinematic Background -->
    <div class="background-container" id="bg-container">
        <div class="bokeh bokeh-1"></div>
        <div class="bokeh bokeh-2"></div>
    </div>

    <!-- Intro Animation Screen -->
    <div id="intro-screen">
        <div class="golden-light" id="golden-light"></div>
        <div class="intro-text" id="text-1">For someone a little special...</div>
        <div class="intro-text" id="text-2">Hiya ♡</div>
        <div class="intro-text" id="text-3">How about a little Momo Evening?</div>
    </div>

    <!-- Main Invitation Screen -->
    <div id="main-screen">
        <div class="glass-card">
            
            <!-- Elegant Momo SVG Illustration -->
            <div class="momo-container">
                <svg viewBox="0 0 100 80" width="100%" height="100%">
                    <!-- Steam -->
                    <path class="steam steam-1" d="M40,30 Q30,10 45,0" />
                    <path class="steam steam-2" d="M50,30 Q65,15 50,-5" />
                    <path class="steam steam-3" d="M60,35 Q70,20 60,5" />
                    
                    <!-- Glow under plate -->
                    <ellipse cx="50" cy="70" rx="35" ry="5" fill="rgba(212, 175, 55, 0.15)" filter="blur(3px)" />
                    
                    <!-- Plate -->
                    <ellipse cx="50" cy="65" rx="45" ry="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
                    <ellipse cx="50" cy="65" rx="35" ry="8" fill="#111" />
                    
                    <!-- Momo Base -->
                    <path d="M20,60 C20,25 80,25 80,60 Z" fill="url(#momo-grad)" />
                    
                    <!-- Momo Pleats/Folds -->
                    <path d="M28,60 Q32,35 40,60" stroke="rgba(212, 175, 55, 0.4)" fill="none" stroke-width="1.5" />
                    <path d="M40,60 Q45,30 50,60" stroke="rgba(212, 175, 55, 0.4)" fill="none" stroke-width="1.5" />
                    <path d="M60,60 Q55,30 50,60" stroke="rgba(212, 175, 55, 0.4)" fill="none" stroke-width="1.5" />
                    <path d="M72,60 Q68,35 60,60" stroke="rgba(212, 175, 55, 0.4)" fill="none" stroke-width="1.5" />
                    
                    <!-- Gradients -->
                    <defs>
                        <linearGradient id="momo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fdf4d8" />
                            <stop offset="100%" stop-color="#e8c779" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <h1>HIYA ♡</h1>
            <div class="subtitle">Momo Evening</div>
            
            <p class="quote">“Good food, warm conversations,<br>and a little time away from everything.”</p>
            
            <div class="location">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                City Centre, Guwahati
            </div>

            <button class="luxury-btn" id="action-btn">
                <span class="btn-text">Let’s Have Momos ♡</span>
            </button>

            <div id="success-message">
                <p>Then it's a plan.<br>Momos + Evening + You = Perfect ♡</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const introScreen = document.getElementById('intro-screen');
            const goldenLight = document.getElementById('golden-light');
            const texts = [
                document.getElementById('text-1'),
                document.getElementById('text-2'),
                document.getElementById('text-3')
            ];
            const mainScreen = document.getElementById('main-screen');
            const bgContainer = document.getElementById('bg-container');
            const musicBtn = document.getElementById('music-btn');
            const actionBtn = document.getElementById('action-btn');
            const successMsg = document.getElementById('success-message');
            const audio = document.getElementById('bg-music');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');

            // --- INTRO SEQUENCE ---
            // Step 1: Expand golden light
            setTimeout(() => {
                goldenLight.style.transition = 'all 2s ease-out';
                goldenLight.style.boxShadow = '0 0 50px 30px rgba(212, 175, 55, 0.4)';
                goldenLight.style.transform = 'scale(5)';
                goldenLight.style.opacity = '1';
            }, 500);

            // Step 2: Show texts sequentially
            let delay = 2500;
            texts.forEach((text, index) => {
                setTimeout(() => {
                    // Hide golden light when first text appears
                    if(index === 0) { goldenLight.style.opacity = '0'; }
                    
                    text.classList.add('active');
                }, delay);
                
                delay += 3000; // time text stays on screen
                
                setTimeout(() => {
                    text.classList.remove('active');
                }, delay - 500); // fade out before next
            });

            // Step 3: Transition to Main Scene
            setTimeout(() => {
                introScreen.style.opacity = '0';
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    bgContainer.style.opacity = '1';
                    mainScreen.style.visibility = 'visible';
                    mainScreen.style.opacity = '1';
                    mainScreen.classList.add('visible');
                    musicBtn.style.opacity = '1';
                }, 2000); // Wait for fade out
            }, delay + 500);


            // --- MUSIC CONTROLS ---
            let isPlaying = false;
            
            function toggleMusic() {
                if (isPlaying) {
                    audio.pause();
                    iconPlay.style.display = 'block';
                    iconPause.style.display = 'none';
                    musicBtn.classList.remove('playing');
                } else {
                    // Modern browsers require error handling for autoplay
                    let playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(_ => {
                            iconPlay.style.display = 'none';
                            iconPause.style.display = 'block';
                            musicBtn.classList.add('playing');
                        }).catch(error => {
                            console.log("Audio play prevented by browser");
                        });
                    }
                }
                isPlaying = !isPlaying;
            }

            musicBtn.addEventListener('click', toggleMusic);

            // Optional: Start music gently on first tap anywhere if not played yet
            document.body.addEventListener('click', () => {
                if(!isPlaying && audio.paused) {
                    toggleMusic();
                }
            }, { once: true });


            // --- BUTTON INTERACTION & PARTICLES ---
            actionBtn.addEventListener('click', (e) => {
                // Hide button smoothly
                actionBtn.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                actionBtn.style.opacity = '0';
                actionBtn.style.transform = 'scale(0.8)';
                
                setTimeout(() => {
                    actionBtn.style.display = 'none';
                    // Show success message
                    successMsg.classList.add('show');
                }, 500);

                // Generate Heart & Sparkle Particles
                createParticles(e.clientX, e.clientY);
            });

            function createParticles(x, y) {
                const emojis = ['🤍', '✨', '🥟', '💛'];
                const particleCount = 20;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    // Randomly select emoji
                    particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    // Position at center of button/click
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    
                    // Randomize movement
                    const spreadX = (Math.random() - 0.5) * 200; // Spread width
                    particle.style.setProperty('--tx', `${spreadX}px`);
                    
                    // Add slight variance to animation duration
                    const duration = 1.5 + Math.random() * 1.5;
                    particle.style.animation = `float-up ${duration}s ease-out forwards`;
                    
                    // Custom keyframe specific to this particle's X spread
                    particle.animate([
                        { transform: `translate(0, 0) scale(0.5) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(${spreadX}px, -150px) scale(1.5) rotate(${Math.random() * 90}deg)`, opacity: 0 }
                    ], {
                        duration: duration * 1000,
                        easing: 'ease-out',
                        fill: 'forwards'
                    });

                    document.body.appendChild(particle);

                    // Cleanup DOM
                    setTimeout(() => {
                        particle.remove();
                    }, duration * 1000);
                }
            }
        });
    </script>
</body>
</html>
